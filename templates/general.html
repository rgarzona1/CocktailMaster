{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail Master</title>
    <link rel="stylesheet" href="{% static 'styles/general.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <div class="header-content">
            <a href=""> Nosotros </a>
            <a href=""> Recetas </a>
            <h1 class="home_title">Cocktail Master </h1>
            <a href=""> Novedades </a>
            <a href=""> Contacto </a>

            <div class="header-buttons">
                <button class="Perfil" type="button" aria-label="Perfil" title="Perfil">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <button class="Log Out" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
                    <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>

        </div>

    </header>

    <main>
        {% block content %}

        {% endblock %}
    </main>
    
    <footer>
        <p> Cocktail Master 2025 </p>
    </footer>

</body>
<script>
    /* Botón de perfil y logout */
    document.querySelector(".Perfil").addEventListener("click", function() {
        window.location.href = "{% url 'perfil_dashboard' %}";
    });

    document.querySelector(".Log.Out").addEventListener("click", function() {
        window.location.href = "{% url 'logout' %}";
    });

    document.querySelector(".home_title").addEventListener("click", function() {
        window.location.href = "{% url 'home' %}";
    });
</script>
</html>
