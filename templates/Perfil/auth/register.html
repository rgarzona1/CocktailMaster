{% extends 'general.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <h2>Crear cuenta</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-auth">Registrarse</button>
    </form>

    <p>¿Ya tienes cuenta?
        <a href="{% url 'login' %}">Inicia sesión aquí</a>
    </p>
</div>
{% endblock %}
